name: Build & Release RMBG Offline APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Restore signing keystores and lineage from secrets
        # ★ 正式版签名轮换：新旧 keystore + lineage 均从 Secrets 恢复
        #   KEYSTORE_BASE64 = 新 keystore (zuimeng.jks) 的 base64
        #   OLD_KEYSTORE_BASE64 = 旧 keystore (zuimeng-old.jks) 的 base64
        #   LINEAGE_BASE64 = lineage.bin 的 base64
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OLD_KEYSTORE_B64: ${{ secrets.OLD_KEYSTORE_BASE64 }}
          OLD_KEYSTORE_PASSWORD: ${{ secrets.OLD_KEYSTORE_PASSWORD }}
          OLD_KEY_PASSWORD: ${{ secrets.OLD_KEY_PASSWORD }}
          LINEAGE_B64: ${{ secrets.LINEAGE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/zuimeng.jks
          echo "$OLD_KEYSTORE_B64" | base64 -d > keystore/zuimeng-old.jks
          echo "$LINEAGE_B64" | base64 -d > lineage.bin
          cat > keystore.properties <<EOF
          storeFile=keystore/zuimeng.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ls -la keystore/ lineage.bin && echo "keystore.properties 已生成"

      - name: Build Release APK
        # ★ 正式版：assembleNormalRelease / assembleLiteRelease
        run: ./gradlew assembleNormalRelease assembleLiteRelease --no-daemon --stacktrace

      - name: Rotate signing (v2 old + v3 new via lineage)
        # ★ 轮换签名：旧证书 v2（minSdk 24-32）+ 新证书 v3/v3.1（minSdk 33+）
        env:
          OLD_KS_PASS: ${{ secrets.OLD_KEYSTORE_PASSWORD }}
          OLD_KEY_PASS: ${{ secrets.OLD_KEY_PASSWORD }}
          NEW_KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          NEW_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          export PATH="$PATH:$ANDROID_HOME/build-tools"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          # Normal APK
          NORMAL_SRC="$(ls app/build/outputs/apk/normal/release/*.apk | grep -v unsigned | head -n 1)"
          "$APKSIGNER" sign \
            --ks keystore/zuimeng-old.jks --ks-key-alias zuimeng \
            --ks-pass "pass:$OLD_KS_PASS" --key-pass "pass:$OLD_KEY_PASS" \
            --lineage lineage.bin \
            --next-signer \
            --ks keystore/zuimeng.jks --ks-key-alias zuimeng \
            --ks-pass "pass:$NEW_KS_PASS" --key-pass "pass:$NEW_KEY_PASS" \
            --v2-signing-enabled true --v3-signing-enabled true --v1-signing-enabled false \
            --out dist/rmbg-normal.apk "$NORMAL_SRC"
          # Lite APK
          LITE_SRC="$(ls app/build/outputs/apk/lite/release/*.apk | grep -v unsigned | head -n 1)"
          "$APKSIGNER" sign \
            --ks keystore/zuimeng-old.jks --ks-key-alias zuimeng \
            --ks-pass "pass:$OLD_KS_PASS" --key-pass "pass:$OLD_KEY_PASS" \
            --lineage lineage.bin \
            --next-signer \
            --ks keystore/zuimeng.jks --ks-key-alias zuimeng \
            --ks-pass "pass:$NEW_KS_PASS" --key-pass "pass:$NEW_KEY_PASS" \
            --v2-signing-enabled true --v3-signing-enabled true --v1-signing-enabled false \
            --out dist/rmbg-lite.apk "$LITE_SRC"
          "$APKSIGNER" verify --verbose --print-certs dist/rmbg-normal.apk
          ls -lh dist/

      - name: Upload Normal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmbg-normal
          path: dist/rmbg-normal.apk
          if-no-files-found: error

      - name: Upload Lite APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmbg-lite
          path: dist/rmbg-lite.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/rmbg-normal.apk dist/rmbg-lite.apk --title "$TAG" --generate-notes --latest