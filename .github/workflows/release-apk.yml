name: Build & Release RMBG Offline APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Restore signing keystore from secrets
        # ★ 正式版签名：keystore 不入库，从 GitHub Secrets 恢复
        #   KEYSTORE_BASE64 = keystore/zuimeng.jks 的 base64；其余三个是密码/别名
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/zuimeng.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/zuimeng.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          ls -la keystore/ && echo "keystore.properties 已生成"

      - name: Build Release APK
        # ★ 正式版：assembleNormalRelease / assembleLiteRelease
        #   （含 "Normal" 触发 downloadQnnBins 自动拉取 QNN bin；GitHub runner 可达官方源）
        run: ./gradlew assembleNormalRelease assembleLiteRelease --no-daemon --stacktrace

      - name: Prepare APK filenames
        # ★ 复制并重命名为规范文件名（rmbg-normal / rmbg-lite），Release 与 Artifact 均用此名
        run: |
          mkdir -p dist
          NORMAL_APK="$(ls app/build/outputs/apk/normal/release/*.apk | grep -v unsigned | head -n 1)"
          LITE_APK="$(ls app/build/outputs/apk/lite/release/*.apk | grep -v unsigned | head -n 1)"
          cp "$NORMAL_APK" dist/rmbg-normal.apk
          cp "$LITE_APK" dist/rmbg-lite.apk
          ls -lh dist/

      - name: Upload Normal APK artifact
        uses: actions/upload-artifact@v4
        with:
          # ★ 完整版独立 artifact（单个 APK 文件，不再打包成 zip）
          name: rmbg-normal
          path: dist/rmbg-normal.apk
          if-no-files-found: error

      - name: Upload Lite APK artifact
        uses: actions/upload-artifact@v4
        with:
          # ★ 精简版独立 artifact（单个 APK 文件）
          name: rmbg-lite
          path: dist/rmbg-lite.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # ★ 正式版双 APK：完整版(normal) + 精简版(lite)，以规范文件名（rmbg-normal / rmbg-lite）上传到 Release
          echo "normal=dist/rmbg-normal.apk"
          echo "lite=dist/rmbg-lite.apk"
          gh release create "$TAG" dist/rmbg-normal.apk dist/rmbg-lite.apk --title "$TAG" --generate-notes --latest