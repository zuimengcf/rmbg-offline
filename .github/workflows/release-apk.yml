name: Build & Release RMBG Offline APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build APK
        # ★ 用显式 flavor 任务：assembleNormalDebug 含 "Normal" 才会触发 downloadQnnBins
        #   （构建时从 HF 自动拉取 3 个 QNN bin，~197MB；GitHub runner 可达官方源）
        #   否则默认 assembleDebug 不下载 bin，normal 版 APK 会缺 QNN 模型
        run: ./gradlew assembleNormalDebug assembleLiteDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmbg-offline-apk
          # ★ 双 flavor：normal + lite 的 debug 产物分别在各自目录（不是 apk/debug/）
          path: |
            app/build/outputs/apk/normal/debug/*.apk
            app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="$(ls app/build/outputs/apk/normal/debug/*.apk | head -n 1)"
          gh release create "$TAG" "$APK" --title "$TAG" --generate-notes --latest